[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abhayleads"
version = "0.1.0"
description = "Local, free-sources lead generation CRM for Abhay"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "feedparser>=6.0,<7",
    "PyYAML>=6.0,<7",
    "PyQt6>=6.6,<7",
]

[project.scripts]
abhayleads = "abhayleads.cli:main"

[tool.setuptools.packages.find]
include = ["abhayleads*"]
