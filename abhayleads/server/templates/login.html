<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Abhay Leads</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width: 360px; padding-top: 60px;">
  <div class="card">
    <h2 style="margin-top:0;">Abhay Leads</h2>
    {% if error %}<p style="color:#a3222e;">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="token_input" style="display:block; font-size:13px; color:#555; margin-bottom:6px;">Access token</label>
      <input type="password" id="token_input" name="token_input" autofocus
             style="width:100%; padding:12px; border:1px solid #d1d1d6; border-radius:8px; font-size:16px;">
      <button type="submit" class="save-button">Log in</button>
    </form>
  </div>
</main>
</body>
</html>
