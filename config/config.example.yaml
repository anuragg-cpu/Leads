product:
  name: "Abhay"
  description: "Sub-GHz RF wireless emergency alert / panic button system for housing societies, co-working spaces, hospitals, and campuses"

  keywords:
    - "emergency alert system"
    - "panic button system"
    - "wireless emergency button"
    - "duress alarm"
    - "campus safety system"
    - "workplace safety alert"
    - "society emergency alarm"
    - "gated community safety system"
    - "hospital staff duress alarm"
    - "nurse call panic button"
    - "campus emergency notification"
    - "student panic button"
    - "facility safety compliance"
    - "co-working space safety"
    - "security system integration RFQ"
    - "low voltage systems tender"
    - "RF wireless security"

  exclude_keywords:
    - "fire alarm"
    - "smoke detector"
    - "Car Alarm"
    - "DIY burglar alarm"
    - "arduino project"
    - "raspberry pi project"
    - "home automation hobby"
    - "personal safety app"

  # Used by osm_places below as search-around points. Keep these at
  # town/locality level, not state level - "Maharashtra" geocodes to a
  # single point near the state's center and a 3km radius around it
  # won't usefully cover Pune. Fine to leave for google_news, though.
  target_locations:
    - "Maharashtra"
    - "Pune"
    - "Pimpri"
    - "Chinchwad"
    - "Talegaon"
    - "Wakad"
    - "Baner"
    - "Balewadi"
    - "Bavdhan"
    - "Aundh"
    - "Karve Nagar"
    - "Chakan"
    - "MIDC"
    - "Bhosari"

sources:
  hackernews:
    enabled: false   # weak fit — this is a dev/startup audience, not your buyer
  google_news:
    enabled: true    # best source for tenders, RERA announcements, project launches
    # Without these, every query defaults to the US edition of Google
    # News, which is why an unqualified "panic button system" mostly
    # returns US school-safety news. query_suffix biases the search
    # itself toward India; it does NOT change what counts as a keyword
    # match above (scoring still uses the plain keywords list), so this
    # can't cause a real match to stop being found.
    query_suffix: "India"
    edition:
      hl: "en-IN"
      gl: "IN"
      ceid: "IN:en"
  github:
    enabled: false   # no plausible lead signal for this product
    token_env_var: "GITHUB_TOKEN"
  reddit:
    enabled: false   # r/startups etc. won't surface builders/hospitals — turn off unless you repoint subreddits
    subreddits:
      - "IndianRealEstate"
      - "civilengineering"
    client_id_env_var: "REDDIT_CLIENT_ID"
    client_secret_env_var: "REDDIT_CLIENT_SECRET"
  osm_places:
    enabled: true    # finds hospitals/co-working/campuses/apartment complexes
                      # by name near each target_location above - see docs/SOURCES.md
    categories:
      - "hospital"
      - "coworking"
      - "campus"
      - "residential"
    radius_meters: 3000
    max_localities: 20

scoring:
  points_per_keyword: 20
  title_match_bonus: 15
  source_weights:
    hackernews: 1.0
    google_news: 1.0
    github: 0.9
    reddit: 0.7
    osm_places: 1.0
  # osm_places finds candidates by category/location, not free-text match,
  # so it has no keywords to score against - this is the floor score they
  # get instead of 0, so they don't get buried under everything else.
  source_base_score:
    osm_places: 30

follow_up:
  default_days: 3
