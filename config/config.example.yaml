product:
  name: "Abhay"
  description: "Sub-GHz RF wireless emergency alert / panic button system for housing societies, co-working spaces, hospitals, and campuses"

  keywords:
    - "emergency alert system"
    - "panic button system"
    - "wireless emergency button"
    - "duress alarm"
    - "campus safety system"
    - "workplace safety alert"
    - "society emergency alarm"
    - "gated community safety system"
    - "hospital staff duress alarm"
    - "nurse call panic button"
    - "campus emergency notification"
    - "student panic button"
    - "facility safety compliance"
    - "co-working space safety"
    - "security system integration RFQ"
    - "low voltage systems tender"
    - "RF wireless security"

  exclude_keywords:
    - "fire alarm"
    - "smoke detector"
    - "Car Alarm"
    - "DIY burglar alarm"
    - "arduino project"
    - "raspberry pi project"
    - "home automation hobby"
    - "personal safety app"

  target_locations:
    - "Maharashtra"
    - "Pune"
    - "Pimpri"
    - "Chinchwad"
    - "Talegaon"
    - "Wakad"
    - "Baner"
    - "Balewadi"
    - "Bavdhan"
    - "Aundh"
    - "Karve Nagar"
    - "Chakan"
    - "MIDC"
    - "Bhosari"

sources:
  hackernews:
    enabled: false   # weak fit — this is a dev/startup audience, not your buyer
  google_news:
    enabled: true    # best source for tenders, RERA announcements, project launches
  github:
    enabled: false   # no plausible lead signal for this product
    token_env_var: "GITHUB_TOKEN"
  reddit:
    enabled: false   # r/startups etc. won't surface builders/hospitals — turn off unless you repoint subreddits
    subreddits:
      - "IndianRealEstate"
      - "civilengineering"
    client_id_env_var: "REDDIT_CLIENT_ID"
    client_secret_env_var: "REDDIT_CLIENT_SECRET"

scoring:
  points_per_keyword: 20
  title_match_bonus: 15
  source_weights:
    hackernews: 1.0
    google_news: 1.0
    github: 0.9
    reddit: 0.7

follow_up:
  default_days: 3
